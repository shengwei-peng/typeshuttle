name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        To ask for support for a remote desktop client that does not work yet, use the **Client compatibility report** form so we get the details needed to add it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: I send long YAML files and have to disable auto-indent on the remote editor every time.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like TypeShuttle to handle it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: This request contains no confidential hostnames, URLs, account names or screenshots.
          required: true
