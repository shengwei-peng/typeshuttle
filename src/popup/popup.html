<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TypeShuttle</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="brand">TypeShuttle</span>
    <span id="site" class="site muted"></span>
    <button id="open-options" type="button" class="link" data-i18n="popupSettings">Settings</button>
  </header>

  <main>
    <section id="state" class="state" hidden>
      <h1 id="state-title"></h1>
      <p id="state-body" class="muted"></p>
      <button id="state-action" type="button" class="primary" hidden></button>
    </section>

    <section id="ready" class="ready" hidden>
      <p id="remaining-banner" class="notice warn" hidden>
        <span data-i18n="remainingLoaded">Loaded the text that was left unsent when the last send stopped.</span>
        <button id="clear-remaining" type="button" class="link" data-i18n="remainingClear">Clear</button>
      </p>

      <div class="modes" role="tablist" aria-label="Send mode" data-i18n-attr="aria-label:modesLabel">
        <button id="mode-direct" type="button" role="tab" aria-selected="true" aria-controls="ready" data-i18n="modeDirect">Direct typing</button>
        <button id="mode-precise" type="button" role="tab" aria-selected="false" aria-controls="ready" data-i18n="modePrecise">Precise transfer</button>
      </div>

      <p id="precise-note" class="muted small" hidden data-i18n="preciseNote">The receiving end must be a bash terminal on the remote desktop.</p>

      <textarea id="text" rows="7" spellcheck="false" placeholder="Paste the text to send" aria-label="Content to send" data-i18n-attr="placeholder:textPlaceholder;aria-label:textLabel"></textarea>

      <div id="file-row" class="file-row" hidden>
        <span data-i18n="fileLabel">Or send a file:</span>
        <input id="file" type="file" hidden>
        <button id="choose-file" type="button" data-i18n="fileChoose">Choose a file</button>
        <span id="file-name" class="file-name"></span>
        <button id="clear-file" type="button" class="link" hidden data-i18n="fileRemove">Remove file</button>
      </div>

      <p id="stats" class="stats"></p>

      <div id="direct-options" class="options">
        <label class="check"><input id="send-tab" type="checkbox"> <span data-i18n="sendTabLabel">Send the Tab key this time (Makefiles and similar)</span></label>
        <label class="inline" for="newline-key"><span data-i18n="newlineKeyLabel">Newline key</span>
          <select id="newline-key">
            <option value="enter">Enter</option>
            <option value="shift-enter" data-i18n="newlineShiftEnterChat">Shift+Enter (chat apps)</option>
          </select>
        </label>
      </div>

      <dl id="precise-details" class="details" hidden>
        <div><dt data-i18n="detailPath">Saved to</dt><dd id="detail-path" class="mono"></dd></div>
        <div><dt data-i18n="detailSize">Original size</dt><dd id="detail-size"></dd></div>
        <div><dt data-i18n="detailTyping">To type</dt><dd id="detail-lines"></dd></div>
        <div><dt>sha256</dt><dd id="detail-sha" class="mono hash"></dd></div>
      </dl>

      <p id="warning" class="notice" hidden></p>

      <button id="send" type="button" class="primary send" data-i18n="sendDirect">Send to remote</button>
      <p class="hint muted"><span data-i18n="hotkeyHintBefore">On the remote desktop tab, press</span> <span id="hotkey-hint"><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>V</kbd></span> <span data-i18n="hotkeyHintAfter">to send the clipboard directly.</span></p>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
